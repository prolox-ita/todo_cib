<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagramma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0000ff;
      user-select: none;
      font-family: sans-serif;
    }

    #canvas {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #svg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── Box ── */
    .box {
      position: absolute;
      width: 140px;
      height: 64px;
      background: #ffffff;
      border-radius: 16px;
      border: 2px solid #cccccc;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 2;
      overflow: visible;
    }

    .box span {
      text-align: center;
      word-break: break-word;
      pointer-events: none;
    }

    .box.source-selected {
      border-color: #00e676;
      box-shadow: 0 0 0 3px rgba(0,230,118,0.4), 0 4px 14px rgba(0,0,0,0.25);
    }

    /* ── Connectors (handles) ── */
    .handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ffaa00;
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: crosshair;
      pointer-events: all;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 5;
    }

    .box:hover .handle { opacity: 1; }

    .handle.top    { top: -8px;    left: 50%; transform: translateX(-50%); }
    .handle.bottom { bottom: -8px; left: 50%; transform: translateX(-50%); }
    .handle.left   { left: -8px;   top: 50%;  transform: translateY(-50%); }
    .handle.right  { right: -8px;  top: 50%;  transform: translateY(-50%); }

    /* ── Resize handle ── */
    .resize-handle {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 13px;
      height: 13px;
      cursor: se-resize;
      pointer-events: all;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 6;
    }

    .box:hover .resize-handle { opacity: 1; }

    /* 3-dot corner indicator */
    .resize-handle::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, #888 1.5px, transparent 1.5px),
        radial-gradient(circle, #888 1.5px, transparent 1.5px),
        radial-gradient(circle, #888 1.5px, transparent 1.5px),
        radial-gradient(circle, #888 1.5px, transparent 1.5px),
        radial-gradient(circle, #888 1.5px, transparent 1.5px),
        radial-gradient(circle, #888 1.5px, transparent 1.5px);
      background-size: 5px 5px;
      background-position:
        0px 8px, 4px 8px, 8px 8px,
        4px 4px, 8px 4px,
        8px 0px;
      background-repeat: no-repeat;
    }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    #toolbar button {
      padding: 9px 20px;
      border: none;
      border-radius: 10px;
      background: #ffffffee;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #111;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      transition: background 0.15s;
    }

    #toolbar button:hover { background: #f0f0f0; }

    /* ── Hint ── */
    #hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Inline edit input ── */
    .box-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      width: 100%;
      text-align: center;
      font-family: inherit;
      cursor: text;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <button id="btn-add">＋ Box</button>
</div>

<div id="canvas">
  <svg id="svg-layer">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
      </marker>
    </defs>
  </svg>
</div>

<div id="hint">Clicca "＋ Box" per aggiungere un box</div>

<script>
  const canvas   = document.getElementById('canvas');
  const svgLayer = document.getElementById('svg-layer');
  const btnAdd   = document.getElementById('btn-add');
  const hint     = document.getElementById('hint');

  let boxes       = [];
  let connections = [];
  let boxCount    = 0;

  // States: 'idle' | 'connect-drawing'
  let mode       = 'idle';
  let connectSrc = null;   // { box, side }
  let tempPath   = null;
  let dragState  = null;
  let resizeState = null;
  let mousePos   = { x: 0, y: 0 };

  /* ─────────────────────────── geometry ─────────────────────────── */

  function handlePoint(box, side) {
    const l = parseFloat(box.style.left);
    const t = parseFloat(box.style.top);
    const w = box.offsetWidth;
    const h = box.offsetHeight;
    return {
      top:    { x: l + w / 2, y: t },
      bottom: { x: l + w / 2, y: t + h },
      left:   { x: l,         y: t + h / 2 },
      right:  { x: l + w,     y: t + h / 2 },
    }[side];
  }

  function nearestSideToPoint(box, pt) {
    const l = parseFloat(box.style.left);
    const t = parseFloat(box.style.top);
    const w = box.offsetWidth;
    const h = box.offsetHeight;
    const cx = l + w / 2, cy = t + h / 2;
    const dx = pt.x - cx, dy = pt.y - cy;
    return Math.abs(dx) >= Math.abs(dy)
      ? (dx > 0 ? 'right' : 'left')
      : (dy > 0 ? 'bottom' : 'top');
  }

  function opposite(side) {
    return { top: 'bottom', bottom: 'top', left: 'right', right: 'left' }[side];
  }

  function controlPoint(p, side, dist) {
    const d = Math.max(dist, 60);
    return {
      top:    { x: p.x,     y: p.y - d },
      bottom: { x: p.x,     y: p.y + d },
      left:   { x: p.x - d, y: p.y     },
      right:  { x: p.x + d, y: p.y     },
    }[side];
  }

  function bezierPath(p1, side1, p2, side2) {
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.45;
    const c1 = controlPoint(p1, side1, dist);
    const c2 = controlPoint(p2, side2, dist);
    return `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`;
  }

  /* ─────────────────────────── rename (inline edit) ─────────────────────────── */

  function startEditing(box) {
    if (mode !== 'idle') return;
    const labelEl = box.querySelector('span');
    if (!labelEl) return;

    const prevText = labelEl.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'box-input';
    input.value = prevText;

    labelEl.replaceWith(input);
    box.style.cursor = 'text';
    input.focus();
    input.select();

    const commit = () => {
      const newText = input.value.trim() || prevText;
      const span = document.createElement('span');
      span.textContent = newText;
      input.replaceWith(span);
      box.style.cursor = '';
      // box may have grown — redraw arrows
      requestAnimationFrame(redrawConnections);
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = prevText; input.blur(); }
      e.stopPropagation();
    });
    input.addEventListener('mousedown', e => e.stopPropagation());
  }

  /* ─────────────────────────── create box ─────────────────────────── */

  function createBox(x, y) {
    boxCount++;
    const box = document.createElement('div');
    box.className = 'box';
    box.id = `box-${boxCount}`;
    box.style.left = `${x - 70}px`;
    box.style.top  = `${y - 32}px`;

    const label = document.createElement('span');
    label.textContent = `Box ${boxCount}`;
    box.appendChild(label);

    // ── Connection handles (4 sides) ──
    ['top', 'right', 'bottom', 'left'].forEach(side => {
      const h = document.createElement('div');
      h.className = `handle ${side}`;
      h.addEventListener('mousedown', e => {
        e.stopPropagation();
        e.preventDefault();
        startDrawing(box, side);
      });
      box.appendChild(h);
    });

    // ── Resize handle (bottom-right) ──
    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    rh.addEventListener('mousedown', e => {
      e.stopPropagation();
      e.preventDefault();
      resizeState = {
        box,
        startX: e.clientX,
        startY: e.clientY,
        startW: box.offsetWidth,
        startH: box.offsetHeight,
      };
    });
    box.appendChild(rh);

    // ── Drag ──
    box.addEventListener('mousedown', e => {
      if (mode !== 'idle') return;
      if (e.target.classList.contains('handle')) return;
      if (e.target.classList.contains('resize-handle')) return;
      if (box.querySelector('input')) return;   // editing — don't drag

      const rect = canvas.getBoundingClientRect();
      dragState = {
        box,
        ox: e.clientX - rect.left - parseFloat(box.style.left),
        oy: e.clientY - rect.top  - parseFloat(box.style.top),
      };
      box.style.zIndex = 10;
      e.preventDefault();
    });

    // ── Double-click to rename ──
    box.addEventListener('dblclick', e => {
      if (e.target.classList.contains('handle')) return;
      if (e.target.classList.contains('resize-handle')) return;
      startEditing(box);
    });

    // ── Accept incoming connection ──
    box.addEventListener('mouseup', e => {
      if (mode === 'connect-drawing' && connectSrc && connectSrc.box !== box) {
        finishConnection(box);
      }
    });

    canvas.appendChild(box);
    boxes.push(box);
    updateHint();
  }

  /* ─────────────────────────── mouse events ─────────────────────────── */

  document.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

    // Drag box
    if (dragState) {
      dragState.box.style.left = `${mousePos.x - dragState.ox}px`;
      dragState.box.style.top  = `${mousePos.y - dragState.oy}px`;
      redrawConnections();
    }

    // Resize box
    if (resizeState) {
      const dw = e.clientX - resizeState.startX;
      const dh = e.clientY - resizeState.startY;
      resizeState.box.style.width  = `${Math.max(80,  resizeState.startW + dw)}px`;
      resizeState.box.style.height = `${Math.max(40, resizeState.startH + dh)}px`;
      redrawConnections();
    }

    // Temp arrow while drawing connection
    if (mode === 'connect-drawing' && tempPath) {
      const p1    = handlePoint(connectSrc.box, connectSrc.side);
      const side2 = opposite(connectSrc.side);
      tempPath.setAttribute('d', bezierPath(p1, connectSrc.side, mousePos, side2));
    }
  });

  document.addEventListener('mouseup', () => {
    if (dragState)   { dragState.box.style.zIndex = ''; dragState = null; }
    if (resizeState) { resizeState = null; }
  });

  /* ─────────────────────────── connections ─────────────────────────── */

  function startDrawing(box, side) {
    // Cancel previous drawing if any
    if (mode === 'connect-drawing') cancelConnect();

    mode = 'connect-drawing';
    connectSrc = { box, side };
    box.classList.add('source-selected');

    tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tempPath.setAttribute('stroke', 'rgba(255,255,255,0.7)');
    tempPath.setAttribute('stroke-width', '2');
    tempPath.setAttribute('fill', 'none');
    tempPath.setAttribute('stroke-dasharray', '8 5');
    svgLayer.appendChild(tempPath);

    updateHint();
  }

  function finishConnection(targetBox) {
    if (tempPath) { svgLayer.removeChild(tempPath); tempPath = null; }
    connectSrc.box.classList.remove('source-selected');

    const srcPt  = handlePoint(connectSrc.box, connectSrc.side);
    const toSide = nearestSideToPoint(targetBox, srcPt);

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('stroke', '#ffffff');
    pathEl.setAttribute('stroke-width', '2.5');
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('marker-end', 'url(#arrow)');
    svgLayer.insertBefore(pathEl, svgLayer.firstChild);

    connections.push({
      from: connectSrc.box, fromSide: connectSrc.side,
      to:   targetBox,      toSide,
      el:   pathEl,
    });

    connectSrc = null;
    mode = 'idle';
    redrawConnections();
    updateHint();
  }

  function cancelConnect() {
    if (tempPath)   { svgLayer.removeChild(tempPath); tempPath = null; }
    if (connectSrc) { connectSrc.box.classList.remove('source-selected'); connectSrc = null; }
    mode = 'idle';
    updateHint();
  }

  function redrawConnections() {
    connections.forEach(c => {
      const p1 = handlePoint(c.from, c.fromSide);
      const p2 = handlePoint(c.to,   c.toSide);
      c.el.setAttribute('d', bezierPath(p1, c.fromSide, p2, c.toSide));
    });
  }

  /* ─────────────────────────── hint ─────────────────────────── */

  function updateHint() {
    if (mode === 'connect-drawing') {
      hint.textContent = 'Clicca su un altro box per collegarlo  •  Esc per annullare';
    } else if (boxes.length === 0) {
      hint.textContent = 'Clicca "＋ Box" per aggiungere un box';
    } else if (boxes.length === 1) {
      hint.textContent = 'Trascina • Doppio clic per rinominare • Angolo in basso a destra per ridimensionare';
    } else {
      hint.textContent = 'Hover su un box → clicca un pallino arancione per collegare  •  Doppio clic per rinominare';
    }
  }

  /* ─────────────────────────── toolbar ─────────────────────────── */

  btnAdd.addEventListener('click', () => {
    if (mode !== 'idle') cancelConnect();
    createBox(
      canvas.offsetWidth  / 2 + (Math.random() - 0.5) * 300,
      canvas.offsetHeight / 2 + (Math.random() - 0.5) * 200
    );
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && mode !== 'idle') cancelConnect();
  });

  // Click on empty canvas cancels connection drawing
  canvas.addEventListener('mousedown', e => {
    if (mode === 'connect-drawing' && (e.target === canvas || e.target === svgLayer)) {
      cancelConnect();
    }
  });
</script>
</body>
</html>
